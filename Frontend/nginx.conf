# Sirve la SPA y hace de proxy: /api → API (.NET), /media → MinIO (imágenes públicas).
# El resolver de Docker + variables hacen que nginx vuelva a resolver los nombres si un
# contenedor se recrea (con proxy_pass fijo cachearía la IP vieja hasta reiniciar).
# Detrás de otro proxy (Caddy en producción) el esquema original llega en X-Forwarded-Proto.
map $http_x_forwarded_proto $proto_original {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api   http://api:8080;
  set $minio http://minio:9000;

  # La IP real del visitante: si la petición viene de un proxy en la red interna (Caddy), se toma de X-Forwarded-For.
  # Sin esto la API vería la IP de Caddy y todos los visitantes compartirían el mismo cupo del rate limit.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  client_max_body_size 12m;   # subida de imágenes (límite de la API: 10 MB + sobre multipart)

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok"; }

  location /api/ {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proto_original;
    proxy_read_timeout 60s;
  }

  location = /health { proxy_pass $api; }

  # No hay favicon: evita que el fallback de la SPA devuelva index.html (100 KB) por cada visita.
  location = /favicon.ico { access_log off; return 204; }

  # /media/2026/09/x.jpg → minio:9000/serenity-media/2026/09/x.jpg (bucket de lectura pública)
  location /media/ {
    rewrite ^/media/(.*)$ /serenity-media/$1 break;
    proxy_pass $minio;
    proxy_set_header Host minio:9000;
    proxy_hide_header Set-Cookie;
    proxy_hide_header x-amz-request-id;
    proxy_hide_header x-amz-id-2;
  }

  # Archivos con hash en el nombre: cacheables para siempre.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: cualquier ruta desconocida devuelve index.html (wouter resuelve en el cliente).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
